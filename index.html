<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuthaSpades | BADAZZ SPADES</title>
<style>
/* MUTHA SPADES - MAIN DESIGN */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: auto;
  padding: 24px 14px 50px;
}
.game-logo {
  width: 100%;
  max-width: 420px;
  height: auto;
  border-radius: 18px;
}
.game-active .game-logo {
  display: none;
}
.spade { font-size: 58px; }
h1 { font-size: 42px; margin: 0 0 4px; }
.subtitle {
  color: #d4af37;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;
}
.tagline {
  font-size: 18px;
  margin: 10px 0 25px;
}
button, select {
  padding: 14px;
  margin: 7px 3px;
  font-size: 19px;
  font-weight: bold;
  border-radius: 12px;
}
.wide {
  width: 100%;
  border: none;
  box-sizing: border-box;
  text-align: center;
}
select.wide {
  text-align: center;
  text-align-last: center;
}
.create {
  background: white;
  color: black;
}
.join {
  background: #333;
  color: white;
  border: 2px solid white;
}
.hidden {
  display: none !important;
}
/* PLAYER AVATAR SELECTION */
#playerSetup {
  margin: 18px 0;
  padding: 16px;
  background: #1b1b1b;
  border: 2px solid #d4af37;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.45);
}
.avatar-picker {
  display: flex;
  align-items: center;
  gap: 14px;
}
.avatar-select-wrap {
  flex: 1;
  min-width: 0;
}
.avatar-label {
  display: block;
  margin-bottom: 7px;
  color: #d4af37;
  font-size: 15px;
  font-weight: bold;
  text-align: left;
  letter-spacing: .5px;
}

.avatar-preview {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #d4af37;
  background: #222;
}
.avatar-preview.hidden {
  display: none !important;
}
#avatarSelect {
  width: 100%;
  max-width: 100%;
  font-size: 16px;
}
#playerName {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  border: 2px solid #d4af37;
}
#status {
  padding: 12px;
  margin: 10px 0;
  font-size: 17px;
  font-weight: bold;
}
#scoreBoard, #bidBoard {
  background: #1b1b1b;
  border: 2px solid #d4af37;
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
}
#scoreBoard {
  font-size: 19px;
}
#bidBoard {
  font-size: 15px;
}
.card-table {
  position: relative;
  width: calc(100% - 20px);
  max-width: 520px;
  height: 320px;
  margin: 18px auto;
  box-sizing: border-box;
  background: radial-gradient(
    ellipse at center,
    #176b42 0%,
    #0b442b 80%,
    #07341f 100%
  );
  border: 8px solid #75451f;
  border-radius: 46%;
  box-shadow: 0 8px 25px rgba(0,0,0,.65);
}
.table-player {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 70px;
  padding: 5px;
  border-radius: 12px;
  background: rgba(0,0,0,.65);
  font-size: 12px;
  z-index: 2;
}
.table-north {
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
}
.table-south {
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
}
.table-east {
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
}
.table-west {
  left: 2px;
  top: 50%;
  transform: translateY(-50%);
}
/* PLAYER AVATARS AROUND THE TABLE */
.player-avatar {
  display: none;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #d4af37;
  background: #222;
}
.table-player.has-avatar .player-avatar {
  display: block;
}
.table-player b {
  display: block;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #fff;
  margin: 3px 0;
}
.card-backs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 95px;
  gap: 2px;
  margin-top: 4px;
}
.card-back {
  width: 12px;
  height: 18px;
  background: #193c9b;
  border: 1px solid #fff;
  border-radius: 3px;
  box-shadow: 0 1px 3px #0008;
}
.table-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 38px;
  color: #d4af37;
  opacity: .5;
  pointer-events: none;
}
.table-played-cards {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.table-played-card {
  position: absolute;
  width: 42px;
  height: 59px;
  background: #fff;
  color: #111;
  border: 2px solid #ddd;
  border-radius: 6px;
  font-size: 18px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 8px #0008;
}
.table-played-card.red {
  color: #c41f28;
}
.table-played-card[data-seat="N"] {
  top: 27%;
  left: 50%;
  transform: translateX(-50%);
}
.table-played-card[data-seat="S"] {
  bottom: 27%;
  left: 50%;
  transform: translateX(-50%);
}
.table-played-card[data-seat="E"] {
  top: 50%;
  right: 23%;
  transform: translateY(-50%);
}
.table-played-card[data-seat="W"] {
  top: 50%;
  left: 23%;
  transform: translateY(-50%);
}

/* PLAYER INFORMATION */
.table-player .player-name {
  font-size: 12px;
  font-weight: bold;
  color: white;
}
.table-player .trick-count {
  font-size: 11px;
  color: #d4af37;
}
/* CARDS IN PLAYER HAND */
#hand {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  margin: 12px 0;
}
#hand button {
  width: 47px;
  height: 69px;
  margin: 2px;
  padding: 2px;
  background: white;
  color: black;
  border: 2px solid #aaa;
  border-radius: 7px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}
#hand button.selected {
  transform: translateY(-9px);
  border: 3px solid #d4af37;
  background: #fff1a6;
}
#hand button:disabled {
  opacity: .65;
}
#hand button.red {
  color: #c41f28;
}
/* BIDDING CONTROLS */
#nilChoice {
  margin: 10px 0;
  padding: 10px;
}
#bidding {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: 10px 0;
}
#bidding button {
  width: 100%;
  margin: 0;
  padding: 10px 0;
  font-size: 16px;
  border-radius: 8px;
}
#playCardButton,
#throwCard {
  width: 100%;
  max-width: 400px;
  padding: 13px;
  margin: 5px auto;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
}
#playCardButton {
  background: #d4af37;
  color: #111;
}
#throwCard {
  background: #8c2020;
  color: white;
}
#playedCards {
  margin: 8px 0;
  padding: 8px;
  font-size: 14px;
}
/* MOBILE SCREEN ADJUSTMENTS */
@media (max-width: 480px) {
  .container {
    padding: 12px 8px 30px;
  }
  .card-table {
    height: 290px;
  }
  .table-player {
    min-width: 60px;
    font-size: 11px;
  }
  .player-avatar {
    width: 48px;
    height: 48px;
  }
}
/* GAMEPLAY SCREEN LAYOUT */
body.game-active .container {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 8px 30px;
}
body.game-active #status {
  order: 0;
  margin: 4px 0;
}
body.game-active #scoreBoard {
  order: 1;
  margin: 4px 0;
}
body.game-active #cardTable {
  order: 2;
  width: 100%;
  max-width: 520px;
  margin: 8px auto;
}
body.game-active #bidBoard {
  order: 3;
  margin: 4px 0;
}
body.game-active #nilChoice,
body.game-active #bidding {
  order: 4;
}
body.game-active #hand {
  order: 5;
}
body.game-active #playCardButton,
body.game-active #throwCard {
  order: 6;
}
body.game-active #playedCards {
  order: 7;
}
body.game-active #nextHand,
body.game-active #newMatch {
  order: 8;
}
/* BIDDING BUTTONS */
body.game-active #bidding:not(.hidden) {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
body.game-active #bidding button {
  width: 100%;
  margin: 0;
  padding: 10px 0;
  font-size: 15px;
}
/* PLAYER HAND */
body.game-active #hand:not(.hidden) {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 3px;
}
body.game-active #hand button {
  min-width: 39px;
  min-height: 58px;
  padding: 5px;
  margin: 2px;
}
body.game-active #hand button.selected {
  transform: translateY(-8px);
  border: 3px solid #d4af37;
  background: #fff1a6;
}
/* KEEP THE GREEN TABLE VISIBLE */
body.game-active #cardTable:not(.hidden) {
  display: block;
}
/* MOBILE GAME ADJUSTMENTS */
@media (max-width: 480px) {
  body.game-active #cardTable {
    height: 290px;
  }
  body.game-active .table-player {
    min-width: 55px;
    padding: 4px;
  }
  body.game-active .player-avatar {
    width: 45px;
    height: 45px;
  }
  body.game-active #hand button {
    font-size: 16px;
  }
}
/* FINAL MOBILE DISPLAY FIXES */
body.game-active #cardTable {
  flex-shrink: 0;
}
body.game-active #hand {
  overflow: visible;
}
body.game-active #nilChoice,
body.game-active #bidding {
  width: 100%;
  box-sizing: border-box;
}
body.game-active #playCardButton,
body.game-active #throwCard {
  width: 100%;
  box-sizing: border-box;
}
body.game-active #playedCards {
  width: 100%;
  box-sizing: border-box;
}
@media (max-width: 380px) {
  body.game-active #cardTable {
    height: 270px;
  }
  body.game-active .player-avatar {
    width: 40px;
    height: 40px;
  }
  body.game-active #hand button {
    font-size: 15px;
  }
}
</style>

<script>
"use strict";

/* GAME CONNECTION */
const GAME_SERVER = "wss://spades-got-real.onrender.com";
let socket = null;
let mySeat = null;
let myRoom = null;
let myTurn = false;
let selectedCard = null;
let currentHand = [];
let gamePhase = "LOBBY";

/* PAGE HELPERS */
function byId(id) {
  return document.getElementById(id);
}

function show(id, visible = true) {
  const element = byId(id);
  if (!element) return;

  element.classList.toggle("hidden", !visible);

  if (id === "cardTable") {
    document.body.classList.toggle(
      "game-active",
      visible
    );
  }
}

function setText(id, value) {
  const element = byId(id);
  if (element) {
    element.textContent = String(value ?? "");
  }
}

function setStatus(message) {
  setText("status", message);
}

function setConnectionStatus(message) {
  setText("connectionStatus", message);
}

/* GAME MESSAGES */
function addGameMessage(message) {
  const container = byId("gameMessages");
  if (!container) return;

  const line = document.createElement("div");
  line.textContent = String(message);
  container.prepend(line);

  while (container.children.length > 20) {
    container.lastElementChild.remove();
  }
}

/* SEND MESSAGES TO SERVER */
function sendGameMessage(type, data = {}) {
  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    setConnectionStatus(
      "Not connected to the game server."
    );
    return false;
  }

  socket.send(JSON.stringify({
    type,
    ...data
  }));

  return true;
}

/* SHOW THE GREEN TABLE */
function showGameTable() {
  show("cardTable", true);
  show("roomInfo", false);
  show("lobby", false);
}

/* HIDE THE GREEN TABLE */
function hideGameTable() {
  show("cardTable", false);
}

/* UPDATE PLAYER NAMES */
function updatePlayerNames(names = {}) {
  for (const seat of ["N", "E", "S", "W"]) {
    const name = names[seat];
    setText("name" + seat, name || seat);
  }
}

/* UPDATE PLAYER AVATARS */
function updatePlayerAvatars(avatars = {}) {
  for (const seat of ["N", "E", "S", "W"]) {
    const image = byId("avatar" + seat);
    if (!image) continue;

    const playerBox = image.closest(".table-player");
    const avatar = avatars[seat];

    if (avatar && typeof avatar === "string") {
      image.src = avatar;
      playerBox?.classList.add("has-avatar");

      image.onerror = function() {
        playerBox?.classList.remove("has-avatar");
      };
    } else {
      image.removeAttribute("src");
      playerBox?.classList.remove("has-avatar");
    }
  }
}

/* END PART 9 */
</script>
<!-- PART 10: GAME CONTROLS -->
<script>
function sendGameMessage(type, extra = {}) {
  if (typeof socket === "undefined" ||
      !socket ||
      socket.readyState !== WebSocket.OPEN) {
    setStatus("Not connected to game server.");
    return false;
  }

  socket.send(JSON.stringify({
    type: type,
    ...extra
  }));
  return true;
}

function createRoom() {
  const name = document.getElementById("playerName")?.value.trim();
  if (!name) {
    setStatus("Enter your player name first.");
    return;
  }

  sendGameMessage("CREATE_ROOM", {
    name: name,
    avatar: document.getElementById("avatarSelect")?.value || ""
  });
}

function joinRoom() {
  const name = document.getElementById("playerName")?.value.trim();
  const code = document.getElementById("roomCode")?.value.trim().toUpperCase();

  if (!name || !code) {
    setStatus("Enter your name and room code.");
    return;
  }

  sendGameMessage("JOIN_ROOM", {
    name: name,
    code: code,
    avatar: document.getElementById("avatarSelect")?.value || ""
  });
}

function playVsComputer() {
  const name = document.getElementById("playerName")?.value.trim();

  if (!name) {
    setStatus("Enter your player name first.");
    return;
  }

  sendGameMessage("PLAY_VS_COMPUTER", {
    name: name,
    avatar: document.getElementById("avatarSelect")?.value || ""
  });
}

function startGame() {
  const targetScore = Number(
    document.getElementById("targetScore")?.value || 500
  );

  sendGameMessage("START_GAME", {
    targetScore: targetScore
  });
}

function nextHand() {
  sendGameMessage("NEXT_HAND");
}

function newMatch() {
  sendGameMessage("NEW_MATCH");
}

function chooseNil() {
  sendGameMessage("BID", { bid: 0 });
  show("nilChoice", false);
}

function choosePlay() {
  show("nilChoice", false);
  show("bidding", true);
}

function submitBid(number) {
  sendGameMessage("BID", { bid: Number(number) });
  show("bidding", false);
}

function playSelectedCard() {
  if (!window.selectedCard) {
    setStatus("Select a card first.");
    return;
  }

  sendGameMessage("PLAY_CARD", {
    card: window.selectedCard
  });
}

function throwCard() {
  playSelectedCard();
}

function keepGameTableVisible() {
  show("cardTable", true);
  document.body.classList.add("game-active");
}

window.keepGameTableVisible = keepGameTableVisible;
</script>
<!-- END PART 10 -->
<!-- PART 11: GAME CONNECTION AND EVENTS -->
<script>
function connectGameServer() {
  if (
    typeof socket !== "undefined" &&
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    setStatus("Connected to game server.");
    return;
  }

  const protocol =
    window.location.protocol === "https:"
      ? "wss:"
      : "ws:";

  const address =
    protocol + "//" + window.location.host;

  window.socket = new WebSocket(address);

  socket.onopen = function() {
    setStatus("Connected to MuthaSpades!");

    setText(
      "connectionStatus",
      "Connected to game server."
    );
  };

  socket.onmessage = function(event) {
    let message;

    try {
      message = JSON.parse(event.data);
    } catch (error) {
      console.error("Invalid game message:", error);
      return;
    }

    handleGameMessage(message);
  };

  socket.onerror = function() {
    setText(
      "connectionStatus",
      "Game connection error."
    );
  };

  socket.onclose = function() {
    setText(
      "connectionStatus",
      "Disconnected from game server."
    );

    setStatus(
      "Connection lost. Refresh to reconnect."
    );
  };
}

function handleGameMessage(message) {
  if (!message || !message.type) {
    return;
  }

  const type = message.type;

  if (type === "GAME_STARTED") {
    keepGameTableVisible();

    show("scoreBoard", true);
    show("bidBoard", true);

    setStatus("Game started! Get ready to bid.");

    return;
  }

  if (type === "HAND_DEALT") {
    keepGameTableVisible();

    if (
      message.hand &&
      typeof renderHand === "function"
    ) {
      renderHand(message.hand);
    }

    return;
  }

  if (type === "BIDDING_COMPLETE") {
    keepGameTableVisible();

    setStatus(
      "Bidding complete. Time to play Spades!"
    );

    return;
  }

  if (type === "CARD_PLAYED") {
    keepGameTableVisible();

    if (
      message.cardCounts &&
      typeof updateCardCounts === "function"
    ) {
      updateCardCounts(message.cardCounts);
    }

    return;
  }

  if (type === "GAME_STATE") {
    if (message.phase !== "LOBBY") {
      keepGameTableVisible();
    }

    if (
      message.avatars &&
      typeof updateTableAvatars === "function"
    ) {
      updateTableAvatars(
        message.avatars,
        message.playerNames || {}
      );
    }

    if (
      message.cardCounts &&
      typeof updateCardCounts === "function"
    ) {
      updateCardCounts(message.cardCounts);
    }

    return;
  }

  if (type === "ERROR") {
    setStatus(
      message.message || "A game error occurred."
    );
  }
}

window.addEventListener(
  "load",
  connectGameServer
);
</script>
