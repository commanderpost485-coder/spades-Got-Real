<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MuthaSpades | BADAZZ SPADES</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #111;

      color: white;

      text-align: center;

    }

    .container {

      max-width: 500px;

      margin: auto;

      padding: 40px 20px;

    }

    h1 {

      font-size: 42px;

      margin-bottom: 5px;

    }

    .spade {

      font-size: 70px;

    }

    .tagline {

      font-size: 18px;

      margin-bottom: 35px;

    }

    button {

      width: 100%;

      padding: 18px;

      margin: 10px 0;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 12px;

      cursor: pointer;

    }

    .create {

      background: white;

      color: black;

    }

    .join {

      background: #333;

      color: white;

      border: 2px solid white;

    }

    #status {

      margin-top: 25px;

      font-size: 16px;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="spade">♠</div>

    <h1>MuthaSpades</h1>
    <div class="subtitle">BADAZZ SPADES</div>
    <div class="tagline">

      Talk yo ish.  Bid big. Don't get set.

    </div>

    <button class="create" onclick="createGame()">

      CREATE GAME

    </button>

    <button class="join" onclick="joinGame()">

      JOIN GAME

    </button>
<div id="seats">
  <div>North: <span id="seatN">Open</span></div>
  <div>East: <span id="seatE">Open</span></div>
  <div>South: <span id="seatS">Open</span></div>
  <div>West: <span id="seatW">Open</span></div>
</div>
    <button id="startGame" onclick="startGame()" style="display:none;">
      START GAME 
      </button>
    
<div id="bidding" style="display:none;">
  <button onclick="submitBid(0)">0</button>
  <button onclick="submitBid(1)">1</button>
  <button onclick="submitBid(2)">2</button>
  <button onclick="submitBid(3)">3</button>
<button onclick="submitBid(4)">4</button>
<button onclick="submitBid(5)">5</button>
<button onclick="submitBid(6)">6</button>
<button onclick="submitBid(7)">7</button>
<button onlick="submitBid(8)">8</button>
<button onlick="submitBid(9)">9</button>
<button onlick="submitBid(10)">10</button>
  
<button onclick="submitBid(11)">11</button>
<button onclick="submitBid(12)">12</button>
<button onclick="submitBid(13)">13</button>
</div>
<div id="hand"></div>
    <div id="status">

      Connecting to game server...

    </div>

  </div>

  <script>

    const status = document.getElementById("status"); let isHost = false;
let mySeat = null;
let myPlayerId = null;
    const socket = new WebSocket("wss://spades-got-real-1.onrender.com");

  socket.onopen = () => {
       status.innerText = "Connected - Ready to Play!";
       socket.send(JSON.stringify({type:'AUTH'}));
};

  


    socket.onerror = () => {

      status.innerText = "Unable to connect to game server.";

    };

    socket.onmessage = (event) =>{
      const msg = JSON.parse(event.data);
  if (msg.type === "AUTH_OK") { 
 myPlayerId = msg.payload.playerId;
    }   
     
 if (msg.type === "ROOM_CREATED") { isHost = true;
status.innerText = "Game created! Room  code: "+ msg.payload.roomCode;
mySeat = msg.payload.seat;
                                        document.getElementById("seatS").innerText = "Occupied";
                                       }
      
      
if (msg.type === "PLAYER_JOINED"){
if (msg.payload.playerId === myPlayerId) mySeat = msg.payload.seat;
          
 status.innerText = "Joined room: " + msg.payload.roomCode;
document.getElementById("seatN").innerText =
  msg.payload.seats.N ? "Occupied" : "Open";
document.getElementById("seatE").innerText =
  msg.payload.seats.E  ? "Occupied" : "Open"
document.getElementById("seatS").innerText =
  msg.payload.seats.S  ? "Occupied" : "Open";
document.getElementById("seatW").innerText =
  msg.payload.seats.W  ? "Occupied" : "Open";                           if (                              isHost &&           msg.payload.seats.N &&    msg.payload.seats.E &&    msg.payload.seats.S &&   msg.payload.seats.W                 ) {    document.getElementById("startGame").style.display = "block";            }                                    } if (msg.type === "GAME_STARTED") {
  status.innerText = "Game started!";
document.getElementById("bidding").style.display = "block";
document.getElementById("startGame").style.display = "none";
}
  if (msg.type === "BID_SUBMITTED") {
  if (msg.payload.seat === mySeat) {
    document.getElementById("bidding").style.display = "none";
    status.innerText = "Bid submitted: " + msg.payload.bid;
  }
}

if (msg.type === "HAND_DEALT") {
    const hand = document.getElementById("hand");
    hand.innerHTML = msg.payload.cards
      .map(card => `<button>${card.rank}${card.suit}</button>`)
      .join("");
    status.innerText = "Cards dealt";
  }
     if (msg.type === "ERROR") {
  status.innerText =
      msg.payload.message || "Game error ";
}
    }     
      function createGame() {
    socket.send(JSON.stringify({
       type: "CREATE_ROOM"
    }));
    
    status.innerText = "Creating game...";
  }
function startGame() {
  socket.send(JSON.stringify({
    type: "START_GAME"
  }));
}
    function submitBid(bid) {
  socket.send(JSON.stringify({
    type: "BID_SUBMITTED",
    payload: {
      seat: mySeat,
      bid: bid
    }
  }));


}
  function joinGame(){
  isHost = false;
document.getElementById("startGame").style.display = "none";
  const code = prompt("Enter your game room code:");

  if (!code) return;
      
  socket.send(JSON.stringify({
    type: "JOIN_ROOM",
   payload: { roomCode: code.toUpperCase()
            }}));

status.innerText = "Joining game...";
  }

  </script>

</body>

  </html>
