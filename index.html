  <style>

#scoreBoard, #playedCards, #bidBoard { padding: 10px; background: #222; border-radius: 10px; line-height: 1.5; }

}
   body.game-active .game-logo,

body.game-active #bidBoard,
body.game-active #status {

    .hidden { display: none; }
    .card-table {
  position: relative;
  width: calc(100% - 20px);
  max-width: 520px;
  height: 300px;
  margin: 20px auto;
  box-sizing: border-box;
  overflow: hidden;
  border: 8px solid #6d351b;
  border-radius: 48%;
  background:
    radial-gradient(circle, #176b3a 0%, #0b4627 75%);

    inset 0 0 25px #000,
    0 6px 18px #000;
}

.table-player {
  position: absolute;
  min-width: 82px;
  padding: 6px 8px;
  color: #ffd700;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid #d4af37;

}

.table-north {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.table-south {
  bottom: 8px;

}

.table-west {
  top: 50%;

  transform: translateY(-50%);
}

.table-east {
  top: 50%;

}

  .held-cards {

  white-space: nowrap;
  background:
    repeating-linear-gradient(45deg, #d71920 0 3px, #5b0d12 3px 6px) 0 4px / 18px 26px no-repeat,
    repeating-linear-gradient(45deg, #d71920 0 3px, #5b0d12 3px 6px) 13px 2px / 18px 26px no-repeat,
    repeating-linear-gradient(45deg, #d71920 0 3px, #5b0d12 3px 6px) 26px 2px / 18px 26px no-repeat,
    repeating-linear-gradient(45deg, #d71920 0 3px, #5b0d12 3px 6px) 39px 4px / 18px 26px no-repeat;
}

.table-center {
  position: absolute;
  top: 50%;
  left: 50%;
  color: #ffd700;
  font-size: 54px;

}

    .table-player {
  --skin: #a86f4a;
  --shirt: #7b1e2b;
  padding: 34px 8px 6px;
}

.table-player::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 50%;
  width: 27px;
  height: 27px;
  background: var(--skin);
  border: 2px solid #3a1d12;
  border-radius: 50%;
  transform: translateX(-50%);
  z-index: 2;
}

.table-player::after {
  content: "";
  position: absolute;
  top: 26px;
  left: 50%;
  width: 58px;
  height: 29px;
  background: var(--shirt);
  border: 2px solid #351017;
  border-radius: 25px 25px 8px 8px;
  transform: translateX(-50%);
  z-index: 1;
}

.table-player b {
  position: relative;
  z-index: 3;
}

.held-cards {
  position: relative;
  display: inline-block;
  padding: 0 13px;
  z-index: 4;
}

.held-cards::before,
.held-cards::after {
  content: "";
  position: absolute;
  top: 7px;
  width: 12px;
  height: 17px;
  background: var(--skin);
  border: 1px solid #3a1d12;
  border-radius: 55%;
  z-index: 5;
}

.held-cards::before {
  left: 0;
  transform: rotate(-25deg);
}

.held-cards::after {
  right: 0;
  transform: rotate(25deg);
}

.table-east {
  --skin: #6f4028;
  --shirt: #1e4f8b;
}

.table-south {
  --skin: #9b603c;
  --shirt: #6b2c91;
}

.table-west {
  --skin: #d2a679;
  --shirt: #2f6b3c;
}
  @keyframes tableRumble {
  0%, 100% {
    transform: translate(0, 0);
  }
  25% {
    transform: translate(-8px, 3px);
  }
  50% {
    transform: translate(8px, -3px);
  }
  75% {
    transform: translate(-5px, 2px);
  }
}

body.table-rumble .container {
  animation: tableRumble 0.35s ease-in-out;
}

<body>
  <div class="container">
    <div class="spade">♠</div>
    <h1>MuthaSpades</h1>
    <div class="subtitle">BADAZZ SPADES</div>
    <div class="tagline">Talk yo ish. Bid big. Don't get set.</div>
    <img class="game-logo" src="https://raw.githubusercontent.com/commanderpost485-coder/spades-Got-Real/main/file_00000000015481fb92483bd950b979d0.jpg" alt="MuthaSpades BADAZZ SPADES">
<div id="playerSetup">
  <input id="playerName" maxlength="20" placeholder="Player name">
  <select id="avatarSelect"></select>
</div>
  <button class="create wide" onclick="createGame()">CREATE GAME</button>
  <button class="join wide" onclick="joinGame()">JOIN GAME</button>

  <div id="seats">
    <div>North: <span id="seatN">Open</span></div>
    <div>East: <span id="seatE">Open</span></div>
    <div>South: <span id="seatS">Open</span></div>
    <div>West: <span id="seatW">Open</span></div>
  </div>
<div id="roomCodeDisplay" class="hidden"></div>

<button id="exitGame" class="wide hidden"
  onclick="exitGame()">EXIT GAME</button>
    <div id="matchSetup" class="hidden">
      <label for="targetScore">Play to:</label>
      <select id="targetScore">
        <option value="500">500 points</option>
        <option value="750">750 points</option>
        <option value="1000">1000 points</option>
      </select>
      <button id="startGame" class="wide hidden" onclick="startGame()">START GAME</button>
    </div>

    <div id="scoreBoard" class="hidden">NS: 0 &nbsp;|&nbsp; EW: 0 &nbsp;|&nbsp; Goal: 500</div>
<div id="playedCards" class="hidden">Cards played: —</div>
<div id="bidBoard" class="hidden">Bids — N: — | E: — | S: — | W: —<br>Your bid: — | Your tricks: 0</div>
<div id="cardTable" class="card-table hidden">
  <div class="table-player table-north">
    <img class="player-avatar" id="avatarN" alt="North avatar">
    <b>North</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>

  <div class="table-player table-west">
    <img class="player-avatar" id="avatarW" alt="West avatar">
    <b>West</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>

  <div class="table-center">♠</div>

  <div class="table-player table-east">
    <img class="player-avatar" id="avatarE" alt="East avatar">
    <b>East</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>

  <div class="table-player table-south">
    <img class="player-avatar" id="avatarS" alt="South avatar">
    <b>South</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>
</div>
    <div id="nilChoice" class="hidden">
      <button onclick="chooseNil()">NIL</button>
      <button onclick="seeCards()">PLAY</button>
    </div>

    <div id="hand"></div>
    <button id="playCardButton" class="wide hidden"
  onclick="playSelectedCard()">PLAY CARD</button>

<button id="throwCard" class="wide hidden"
  onclick="throwDownCard()">THROW DOWN CARD</button>
    <div id="bidding" class="hidden"></div>

    <button id="nextHand" class="wide hidden" onclick="nextHand()">START NEXT HAND</button>
    <button id="newMatch" class="wide hidden" onclick="newMatch()">START NEW MATCH</button>
    <div id="tableTalk" class="hidden"></div>
    <div id="talkChoices" class="hidden"></div>
<div id="customTalk" class="hidden">
  <input id="customTalkInput" maxlength="80"
    placeholder="Type your own saying">
  <button type="button"
    onclick="sendCustomTalk()">SEND CUSTOM SAYING</button>
</div>
    <button id="newTalk" class="wide hidden" onclick="requestTalkChoices()">NEW SAYINGS</button>
    <div id="status">Connecting to game server...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const socket = new WebSocket("wss://spades-got-real.onrender.com");
    const AVATARS = [
  { file: "avatar-pj-photo.png", label: "PJ" },
  { file: "avatar-01.png", label: "Avatar 1" },
  { file: "avatar-02.png", label: "Avatar 2" },
  { file: "avatar-03.png", label: "Avatar 3" },
  { file: "avatar-04.png", label: "Avatar 4" },
  { file: "avatar-05.png", label: "Avatar 5" },
  { file: "avatar-06.png", label: "Avatar 6" },
  { file: "avatar-07.png", label: "Avatar 7" },
  { file: "avatar-08.png", label: "Avatar 8" },
  { file: "avatar-09.png", label: "Avatar 9" },
  { file: "avatar-10.png", label: "Avatar 10" },
  { file: "avatar-drag-queen.png", label: "Drag Queen" },
  { file: "avatar-white-drag-queen.png", label: "White Drag Queen" },
  { file: "avatar-masculine-female.png", label: "Masculine Female" },
  { file: "avatar-white-woman.png", label: "White Woman" },
  { file: "avatar-gorgeous-man.png", label: "Gorgeous Man" },
  { file: "avatar-white-man.png", label: "White Man" },
  { file: "avatar-south.png", label: "South", private: true },
  { file: "avatar-charly-sunglasses.png", label: "Charly Sunglasses", private: true },
  { file: "avatar-charly-hoodie.png", label: "Charly Hoodie", private: true }
];

const PRIVATE_AVATARS = new Set(
  AVATARS.filter(avatar => avatar.private).map(avatar => avatar.file)
);

function isLillyName(name = "") {
  return ["lilly", "charly", "charleen"].includes(
    String(name).trim().toLowerCase()
  );
}

function getPlayerName() {
  return document.getElementById("playerName").value.trim() || "Player";
}

function getSelectedAvatar() {
  return document.getElementById("avatarSelect").value || "avatar-pj-photo.png";
}

function renderAvatarChoices() {
  const select = document.getElementById("avatarSelect");
  const current = select.value;
  const name = getPlayerName();

  select.innerHTML = "";
  for (const avatar of AVATARS) {
    if (avatar.private && !isLillyName(name)) continue;

    const option = document.createElement("option");
    option.value = avatar.file;
    option.textContent = avatar.label;
    select.appendChild(option);
  }

  if ([...select.options].some(option => option.value === current)) {
    select.value = current;
  }
}

function updateTableAvatars(avatars = {}, playerNames = {}) {
  const names = { N: "North", E: "East", S: "South", W: "West" };

  for (const seat of ["N", "E", "S", "W"]) {
    const img = document.getElementById(`avatar${seat}`);
    const playerBox = document.querySelector(
      `.table-${seat === "N" ? "north" : seat === "E" ? "east" : seat === "S" ? "south" : "west"}`
    );
    const label = playerBox ? playerBox.querySelector("b") : null;

    if (label) label.textContent = playerNames[seat] || names[seat];

    if (img && avatars[seat]) {
      img.src = `avatars/${avatars[seat]}`;
      playerBox.classList.add("has-avatar");
    }
  }
}

document.getElementById("playerName").addEventListener("input", renderAvatarChoices);
renderAvatarChoices();
document.getElementById("matchSetup")
.after(document.getElementById("exitGame"));
    let isHost = false;
    let mySeat = null;
    let myPlayerId = null;
    let myBid = null;
    let bids = {};
    let tricks = { N: 0, E: 0, S: 0, W: 0 };
    let trickPlays = [];
    let currentTarget = 500;
    let currentPlayTurn = null;

    const savedRoomCode = localStorage.getItem("roomCode");
    const savedSeat = localStorage.getItem("seat");

    const bidBox = document.getElementById("bidding");
    for (let bid = 0; bid <= 13; bid++) {
      const button = document.createElement("button");
      button.textContent = bid;
      button.onclick = () => submitBid(bid);
      bidBox.appendChild(button);
    }

    function show(id, visible = true) {
document.getElementById(id).classList.toggle("hidden", !visible);

  if (id === "cardTable") {
    document.body.classList.toggle("game-active", visible);
  }
}
    function updatePlayControls() {
  const myTurn = currentPlayTurn === mySeat;
  const playButton = document.getElementById("playCardButton");
  const throwButton = document.getElementById("throwCard");
  const selected = playCard.selected;
  const disabled = !myTurn || !selected;

  show("playCardButton", Boolean(currentPlayTurn));
  show("throwCard", Boolean(currentPlayTurn));

  playButton.disabled = disabled;
  throwButton.disabled = disabled;

  playButton.textContent = selected
    ? `PLAY ${selected.rank}${selected.suit}`
    : "PLAY CARD";

  throwButton.textContent = selected
    ? `THROW DOWN ${selected.rank}${selected.suit}`
    : "THROW DOWN CARD";

  document.querySelectorAll("#hand button").forEach(cardButton => {
    cardButton.disabled = !myTurn;
  });
}
    function showRoomCode(roomCode) {
    const roomCodeDisplay = document.getElementById("roomCodeDisplay");

  roomCodeDisplay.innerText =
    `ROOM CODE: ${roomCode}`;

  show("roomCodeDisplay", true);
  show("exitGame", true);
}
function requestTalkChoices() {
  socket.send(JSON.stringify({ type: "GET_TALK_CHOICES" }));
}

function sendTableTalk(message) {
  socket.send(JSON.stringify({
    type: "SEND_TABLE_TALK",
    payload: { message }
  }));
  show("talkChoices", false);
  show("newTalk", true);
}
    function sendCustomTalk() {
  const input =
    document.getElementById("customTalkInput");
  const message = input.value.trim();

  if (!message) return;

  sendTableTalk(message);
  input.value = "";
}
    function updateSeats(seats) {
      for (const seat of ["N", "E", "S", "W"]) {
        document.getElementById(`seat${seat}`).innerText =
  (document.body.classList.contains("game-active") ||
    seats[seat])
    ? "Occupied"
    : "Open";
      }
      const full = seats.N && seats.E && seats.S && seats.W;
      if (isHost) {
        show("matchSetup", true);
        show("startGame", Boolean(full));
      }
    }

    function updateBoards() {
      show("bidBoard", true);
      show("scoreBoard", true);
      show("playedCards", true);
      const value = seat => bids[seat] === undefined ? "—" : bids[seat];
      const mine = myBid === null ? "—" : myBid;
      const myTricks = mySeat ? (tricks[mySeat] || 0) : 0;
      document.getElementById("bidBoard").innerHTML =
        `Bids — N: ${value("N")} | E: ${value("E")} | S: ${value("S")} | W: ${value("W")}<br>` +
        `Your bid: ${mine} | Your tricks: ${myTricks}`;
    }

    function updateScore(scores = { NS: 0, EW: 0 }, target = currentTarget) {
      currentTarget = target;
      show("scoreBoard", true);
      document.getElementById("scoreBoard").innerText = `NS: ${scores.NS} | EW: ${scores.EW} | Goal: ${target}`;
    }

    function renderHand(cards) {
      const suitSymbols = { S: "♠", H: "♥", D: "♦", C: "♣" };
      const suitOrder = { S: 0, H: 1, D: 2, C: 3 };
      const rankOrder = { A: 14, K: 13, Q: 12, J: 11, "10": 10, "9": 9, "8": 8, "7": 7, "6": 6, "5": 5, "4": 4, "3": 3, "2": 2 };
      const sorted = [...cards].sort((a, b) => suitOrder[a.suit] - suitOrder[b.suit] || rankOrder[b.rank] - rankOrder[a.rank]);
      document.getElementById("hand").innerHTML = sorted.map(card => {
        const color = card.suit === "H" || card.suit === "D" ? "#c62828" : "#111";
        return `<button style="color:${color}" onclick="playCard('${card.rank}','${card.suit}')">${card.rank}${suitSymbols[card.suit]}</button>`;
      }).join("");
    }

    socket.onopen = () => {
      statusEl.innerText = "Connected - Ready to Play!";
      socket.send(JSON.stringify({ type: "AUTH" }));
    };
    socket.onerror = () => statusEl.innerText = "Unable to connect to game server.";

    socket.onmessage = event => {
      const msg = JSON.parse(event.data);
      const p = msg.payload || {};
if (msg.type === "TABLE_TALK") {
  const tableTalk = document.getElementById("tableTalk");
  tableTalk.innerText = p.message;
  show("tableTalk", true);
}
     if (msg.type === "TABLE_TALK_CHOICES") {
  const talkChoices =
    document.getElementById("talkChoices");

  talkChoices.innerHTML = "";

  for (const message of p.choices || []) {
    const button = document.createElement("button");
    button.textContent = message;
    button.onclick = () => sendTableTalk(message);
    talkChoices.appendChild(button);
  }

  show("talkChoices", true);
  show("newTalk", true);
  show("customTalk", true);
}
      if (msg.type === "AUTH_OK") {
        myPlayerId = p.playerId;
        if (savedRoomCode && savedSeat) {
  socket.send(JSON.stringify({
    type: "REJOIN_ROOM",
    payload: {
      roomCode: savedRoomCode,
      seat: savedSeat,
      playerName: getPlayerName(),
      avatar: getSelectedAvatar()
    }
  }));
}

      if (msg.type === "ROOM_CREATED") {
        isHost = true;
        mySeat = p.seat;
        localStorage.setItem("roomCode", p.roomCode);
        localStorage.setItem("seat", p.seat);
        statusEl.innerText = `Game created! Room code: ${p.roomCode}`;
        updateSeats(p.seats);
        updateTableAvatars(p.avatars,    p.playerNames);
        showRoomCode(p.roomCode);
      }

      if (msg.type === "PLAYER_JOINED") {
        if (p.playerId === myPlayerId) {
          mySeat = p.seat;
          localStorage.setItem("roomCode", p.roomCode);
          localStorage.setItem("seat", p.seat);
        }
        statusEl.innerText = `Joined room: ${p.roomCode}`;
        updateSeats(p.seats);
        updateTableAvatars(p.avatars, p.playerNames);
        showRoomCode(p.roomCode);
      }
      if (msg.type === "PLAYER_DISCONNECTED") {
    updateSeats(p.seats); 
    updateTableAvatars(p.avatars, p.playerNames);
    }
    if (msg.type === "GAME_STATE") {
  mySeat = p.seat;
  isHost = Boolean(p.isHost);
      showRoomCode(p.roomCode);
      updateTableAvatars(p.avatars, p.playerNames);
bids = p.bids || {};
  myBid = bids[mySeat] === undefined
    ? null
    : bids[mySeat];
  tricks = p.tricks || {
    N: 0,
    E: 0,
    S: 0,
    W: 0
  };
  currentTarget = p.targetScore || 500;
      trickPlays = (p.currentTrick || []).map(play =>
  `${play.seat} played ${play.card.rank}${play.card.suit}`
);

  localStorage.setItem("roomCode", p.roomCode);
  localStorage.setItem("seat", mySeat);

  updateSeats(p.seats);
  updateScore(p.scores, currentTarget);
  currentPlayTurn = p.playTurn || null;
  updateBoards();

  show("nilChoice", false);
  show("bidding", false);
  show("nextHand", false);
  show("newMatch", false);

  if (p.phase !== "LOBBY") {
    document.querySelector(".create").style.display = "none";
    document.body.classList.add("game-active");
document.querySelector(".join").style.display = "none";
    show("matchSetup", false);
    show("startGame", false);
    renderHand(p.cards || []);
    show("cardTable", true);
    requestTalkChoices();
  }

  if (p.phase === "LOBBY") {
    statusEl.innerText =
      `Rejoined room: ${p.roomCode}`;
  } else if (p.phase === "BIDDING") {
    if (p.bidTurn === mySeat && !p.nilChoice) {
      show("nilChoice", true);
    }

    if (
      p.bidTurn === mySeat &&
      p.nilChoice === "SEE_CARDS" &&
      myBid === null
    ) {
      show("bidding", true);
    }

    statusEl.innerText =
      p.bidTurn === mySeat
        ? "Your turn to bid"
        : `${p.bidTurn}'s turn to bid`;
  } else if (p.phase === "PLAYING") {
    currentPlayTurn = p.playTurn;
updatePlayControls();
    const turnText = p.playTurn === mySeat
  ? "YOUR TURN TO PLAY"
  : `NEXT PLAYER: ${p.playTurn}`;

document.getElementById("playedCards").innerText =
  trickPlays.length ? `Cards played: ${trickPlays.join(" | ")}` : "Cards played: —";
statusEl.innerText = turnText;
  } else if (p.phase === "HAND_OVER") {
    document.getElementById("hand").innerHTML = "";
    statusEl.innerText = "Hand over.";

    if (isHost) {
      const gameOver =
        p.scores.NS >= currentTarget ||
        p.scores.EW >= currentTarget;

      if (gameOver) {
        show("matchSetup", true);
        show("newMatch", true);
      } else {
        show("nextHand", true);
      }
    }
  }
}
       if (msg.type === "GAME_STARTED") {
document.body.classList.add("game-active");
      requestTalkChoices();
      show("cardTable", true);
      currentTarget = p.targetScore;
document.querySelector(".create").style.display = "none";
document.querySelector(".join").style.display = "none";
        show("matchSetup", false);
        show("startGame", false);
        updateScore({ NS: 0, EW: 0 }, currentTarget);
      }

      if (msg.type === "HAND_STARTED") {
        bids = {};
        myBid = null;
        tricks = { N: 0, E: 0, S: 0, W: 0 };
        trickPlays = [];
        currentPlayTurn = null;
playCard.selected = null;
show("throwCard", false);
document.getElementById("hand").innerHTML = "";
        show("nilChoice", false);
        show("bidding", false);
        show("nextHand", false);
        show("newMatch", false);
        updateScore(p.scores, p.targetScore);
        updateBoards();
        statusEl.innerText = `Hand ${p.handNumber}: East bids first`;
      }

      if (msg.type === "BID_TURN") {
        currentPlayTurn = null;
        bids = p.bids || bids;
        updateBoards();
        show("nilChoice", false);
        show("bidding", false);
        statusEl.innerText = `${p.seat}'s turn to choose NIL or PLAY`;
      }

      if (msg.type === "NIL_PROMPT" && p.seat === mySeat) {
        show("nilChoice", true);
        statusEl.innerText = "Your turn: Choose NIL or PLAY";
      }

      if (msg.type === "NIL_LOCKED") {
        myBid = "NIL";
        show("nilChoice", false);
        show("bidding", false);
        updateBoards();
        statusEl.innerText = "NIL locked in for 100 points";
      }

      if (msg.type === "HAND_DEALT" && p.seat === mySeat) {
        renderHand(p.cards);
        show("nilChoice", false);
        show("bidding", Boolean(p.allowBid));
        if (p.allowBid) statusEl.innerText = "Choose your bid";
      }

      if (msg.type === "BID_SUBMITTED") {
        bids = p.bids || { ...bids, [p.seat]: p.bid };
        if (p.seat === mySeat) {
          myBid = p.bid;
          show("bidding", false);
          show("nilChoice", false);
        }
        updateBoards();
      }

      if (msg.type === "BIDDING_COMPLETE") {
        bids = p.bids;
        tricks = p.tricks;
        currentPlayTurn = p.playTurn;
        playCard.selected = null;
updatePlayControls();
        show("bidding", false);
        show("nilChoice", false);
        updateBoards();
        statusEl.innerText = "Bidding complete. East plays first.";
      }

      if (msg.type === "CARD_PLAYED") {
        currentPlayTurn = p.nextTurn;
playCard.selected = null;
updatePlayControls();
    if (p.playStyle === "throw") {
  document.body.classList.remove("table-rumble");
  void document.body.offsetWidth;
  document.body.classList.add("table-rumble");

  setTimeout(() => {
document.body.classList.remove("table-rumble");
  }, 350);
}
  
if (trickPlays.length >= 4) {
  trickPlays = [];
}
trickPlays.push(`${p.seat} played ${p.card.rank}${p.card.suit}`);
document.getElementById("playedCards").innerText =
  `Cards played: ${trickPlays.join(" | ")}`;
statusEl.innerText = `NEXT PLAYER: ${p.nextTurn}`;
      }

      if (msg.type === "HAND_OVER") {
        currentPlayTurn = null;
playCard.selected = null;
show("playCardButton", false);
show("throwCard", false);
tricks = p.tricks;
bids = p.bids;
        document.getElementById("hand").innerHTML = "";
        show("bidding", false);
        show("nilChoice", false);
        updateBoards();
        updateScore(p.totalScore, p.targetScore);
        statusEl.innerText = p.gameOver
          ? `MATCH OVER! ${p.winner} wins. Final score — NS: ${p.totalScore.NS}, EW: ${p.totalScore.EW}`
          : `Hand over — NS scored ${p.handScore.NS}, EW scored ${p.handScore.EW}.`;
        if (isHost) {
          if (p.gameOver) { show("matchSetup", true); show("newMatch", true); }
          else show("nextHand", true);
        }
      }

      if (msg.type === "ERROR") {
  if (p.message === "Room not found") {
localStorage.removeItem("roomCode");
    localStorage.removeItem("seat");
    mySeat = null;
    statusEl.innerText =
  "Choose CREATE GAME or JOIN GAME";
return;
  }

  statusEl.innerText =
    p.message || "Game error";
}
    };
function exitGame(){
localStorage.removeItem("roomCode");
localStorage.removeItem("seat");
  window.location.reload();
}
    function createGame() {
  socket.send(JSON.stringify({
    type: "CREATE_ROOM",
    payload: {
      playerName: getPlayerName(),
      avatar: getSelectedAvatar()
    }
  }));
  statusEl.innerText = "Creating game...";
}
    function joinGame() {
  const code = prompt("Enter your game room code:");
  if (!code) return;

  localStorage.removeItem("roomCode");
  localStorage.removeItem("seat");

  socket.send(JSON.stringify({
    type: "JOIN_ROOM",
    payload: {
      roomCode: code.toUpperCase(),
      playerName: getPlayerName(),
      avatar: getSelectedAvatar()
    }
  }));

  statusEl.innerText = "Joining game...";
}
    function startGame() {
      currentTarget = Number(document.getElementById("targetScore").value);
      socket.send(JSON.stringify({ type: "START_GAME", payload: { targetScore: currentTarget } }));
    }
    function chooseNil() { socket.send(JSON.stringify({ type: "NIL_CHOICE", payload: { seat: mySeat, choice: "NIL" } })); }
    function seeCards() { socket.send(JSON.stringify({ type: "NIL_CHOICE", payload: { seat: mySeat, choice: "SEE_CARDS" } })); }
    function submitBid(bid) { socket.send(JSON.stringify({ type: "BID_SUBMITTED", payload: { seat: mySeat, bid } })); }
  function playCard(rank, suit) {
  if (currentPlayTurn !== mySeat) return;

  playCard.selected = { rank, suit };
  updatePlayControls();
  }

function sendSelectedCard(playStyle) {
  const card = playCard.selected;
  if (!card || currentPlayTurn !== mySeat) return;

  socket.send(JSON.stringify({
    type: "CARD_PLAYED",
    payload: {
      seat: mySeat,
      card,
      playStyle
    }
  }));

  playCard.selected = null;
  updatePlayControls();
}

function playSelectedCard() {
  sendSelectedCard("normal");
}

function throwDownCard() {
  sendSelectedCard("throw");
}
    function nextHand() { socket.send(JSON.stringify({ type: "NEXT_HAND" })); }
    function newMatch() {
      currentTarget = Number(document.getElementById("targetScore").value);
      socket.send(JSON.stringify({ type: "NEW_MATCH", payload: { targetScore: currentTarget } }));
    }
  </script>
</body>
