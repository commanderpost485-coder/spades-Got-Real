<!DOCTYPE html>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: white; text-align: center; }
    .container { max-width: 600px; margin: auto; padding: 24px 14px 50px; }
    .game-logo {
  width: 100%;
  max-width: 420px;
  height: auto;
  border-radius: 18px;
}

.game-active .game-logo {
  max-width: 150px;
}
    .spade { font-size: 58px; }
    h1 { font-size: 42px; margin: 0 0 4px; }
    .subtitle { color: #d4af37; font-size: 22px; font-weight: bold; letter-spacing: 2px; }
    .tagline { font-size: 18px; margin: 10px 0 25px; }
    button, select { padding: 14px; margin: 7px 3px; font-size: 19px; font-weight: bold; border-radius: 12px; }

    #status { margin-top: 20px; font-size: 18px; white-space: pre-line; }

  margin: 18px 0;
  padding: 14px;

  background: #300;
  border: 2px solid #d4af37;

}
    #talkChoices button {
  width: 100%;

  color: #ffff;
  background: #7b0015;

}
    #customTalkInput,
#customTalk button {
  height: 54px;

}

#customTalkInput {
  padding: 0 12px;
  font-size: 18px;

}

#newTalk {
  width: auto;

  font-size: 16px;
}
   body.game-active .game-logo,
body.game-active #seats,
body.game-active #roomCodeDisplay,
body.game-active #exitGame {
  display: none;
}
    body.game-active .container {
  display: flex;
  flex-direction: column;
}q

body.game-active #status {
  order: 1;
}

body.game-active #nilChoice,
body.game-active #bidding {
  order: 2;
}

body.game-active #hand {

}

body.game-active #throwCard {

}

body.game-active #cardTable {

}

}

}

body.game-active #nextHand,
body.game-active #newMatch {

}

body.game-active #tableTalk,
body.game-active #talkChoices,
body.game-active #customTalk,
body.game-active #newTalk {

}
    .hidden { display: none; }
    .card-table {
  position: relative;
  width: calc(100% - 20px);
  max-width: 520px;
  height: 300px;
  margin: 20px auto;
  box-sizing: border-box;
  overflow: hidden;
  border: 8px solid #6d351b;
  border-radius: 48%;
  background:
    radial-gradient(circle, #176b3a 0%, #0b4627 75%);
  box-shadow:
    inset 0 0 25px #000,
    0 6px 18px #000;
}

.table-player {
  position: absolute;
  min-width: 82px;
  padding: 6px 8px;
  color: #ffd700;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid #d4af37;
  border-radius: 10px;
  text-align: center;
  z-index: 2;
}

.table-north {
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.table-south {
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
}

.table-west {
  top: 50%;
  left: 4px;
  transform: translateY(-50%);
}

.table-east {
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
}

.held-cards {
  margin-top: 3px;
  color: #c91524;
  font-size: 25px;
  letter-spacing: -7px;
  white-space: nowrap;
}

.table-center {
  position: absolute;
  top: 50%;
  left: 50%;
  color: #ffd700;
  font-size: 54px;
  transform: translate(-50%, -50%);
}

    .table-player {
  --skin: #a86f4a;
  --shirt: #7b1e2b;
  padding: 34px 8px 6px;
}

.table-player::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 50%;
  width: 27px;
  height: 27px;
  background: var(--skin);
  border: 2px solid #3a1d12;
  border-radius: 50%;
  transform: translateX(-50%);
  z-index: 2;
}

.table-player::after {
  content: "";
  position: absolute;
  top: 26px;
  left: 50%;
  width: 58px;
  height: 29px;
  background: var(--shirt);
  border: 2px solid #351017;
  border-radius: 25px 25px 8px 8px;
  transform: translateX(-50%);
  z-index: 1;
}

.table-player b {
  position: relative;
  z-index: 3;
}

.held-cards {
  position: relative;
  display: inline-block;
  padding: 0 13px;
  z-index: 4;
}

.held-cards::before,
.held-cards::after {
  content: "";
  position: absolute;
  top: 7px;
  width: 12px;
  height: 17px;
  background: var(--skin);
  border: 1px solid #3a1d12;
  border-radius: 55%;
  z-index: 5;
}

.held-cards::before {
  left: 0;
  transform: rotate(-25deg);
}

.held-cards::after {
  right: 0;
  transform: rotate(25deg);
}

.table-east {
  --skin: #6f4028;
  --shirt: #1e4f8b;
}

.table-south {
  --skin: #9b603c;
  --shirt: #6b2c91;
}

.table-west {
  --skin: #d2a679;
  --shirt: #2f6b3c;
}
  @keyframes tableRumble {
  0%, 100% {
    transform: translate(0, 0);
  }
  25% {
    transform: translate(-8px, 3px);
  }
  50% {
    transform: translate(8px, -3px);
  }
  75% {
    transform: translate(-5px, 2px);
  }
}

body.table-rumble .container {
  animation: tableRumble 0.35s ease-in-out;
}

  </style>
</head>
<body>
  <div class="container">
    <div class="spade">♠</div>
    <h1>MuthaSpades</h1>
    <div class="subtitle">BADAZZ SPADES</div>
    <div class="tagline">Talk yo ish. Bid big. Don't get set.</div>

   <img class="game-logo" src="https://raw.githubusercontent.com/commanderpost485-coder/spades-Got-Real/main/file_00000000015481fb92483bd950b979d0.jpg" alt="MuthaSpades BADAZZ SPADES">

  <button class="create wide" onclick="createGame()">CREATE GAME</button>
  <button class="join wide" onclick="joinGame()">JOIN GAME</button>

  <div id="seats">
    <div>North: <span id="seatN">Open</span></div>
    <div>East: <span id="seatE">Open</span></div>
    <div>South: <span id="seatS">Open</span></div>
    <div>West: <span id="seatW">Open</span></div>
  </div>
<div id="roomCodeDisplay" class="hidden"></div>

<button id="exitGame" class="wide hidden"
  onclick="exitGame()">EXIT GAME</button>
    <div id="matchSetup" class="hidden">
      <label for="targetScore">Play to:</label>
      <select id="targetScore">
        <option value="500">500 points</option>
        <option value="750">750 points</option>
        <option value="1000">1000 points</option>
      </select>
      <button id="startGame" class="wide hidden" onclick="startGame()">START GAME</button>
    </div>

    <div id="scoreBoard" class="hidden">NS: 0 &nbsp;|&nbsp; EW: 0 &nbsp;|&nbsp; Goal: 500</div>
    <div id="bidBoard" class="hidden">Bids — N: — | E: — | S: — | W: —<br>Your bid: — | Your tricks: 0</div>
<div id="cardTable" class="card-table hidden">
  <div class="table-player table-north">
    <b>North</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>

  <div class="table-player table-west">
    <b>West</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>

  <div class="table-center">♠</div>

  <div class="table-player table-east">
    <b>East</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>

  <div class="table-player table-south">
    <b>South</b>
    <div class="held-cards">🂠 🂠 🂠</div>
  </div>
</div>
    <div id="nilChoice" class="hidden">
      <button onclick="chooseNil()">NIL</button>
      <button onclick="seeCards()">PLAY</button>
    </div>

    <div id="hand"></div>
    <button id="throwCard" class="wide hidden"
  onclick="throwDownCard()">THROW DOWN CARD</button>
    <div id="bidding" class="hidden"></div>

    <button id="nextHand" class="wide hidden" onclick="nextHand()">START NEXT HAND</button>
    <button id="newMatch" class="wide hidden" onclick="newMatch()">START NEW MATCH</button>
    <div id="tableTalk" class="hidden"></div>
    <div id="talkChoices" class="hidden"></div>
<div id="customTalk" class="hidden">
  <input id="customTalkInput" maxlength="80"
    placeholder="Type your own saying">
  <button type="button"
    onclick="sendCustomTalk()">SEND CUSTOM SAYING</button>
</div>
    <button id="newTalk" class="wide hidden" onclick="requestTalkChoices()">NEW SAYINGS</button>
    <div id="status">Connecting to game server...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const socket = new WebSocket("wss://spades-got-real.onrender.com");
    let isHost = false;
    let mySeat = null;
    let myPlayerId = null;
    let myBid = null;
    let bids = {};
    let tricks = { N: 0, E: 0, S: 0, W: 0 };
    let trickPlays = [];
    let currentTarget = 500;

    const savedRoomCode = localStorage.getItem("roomCode");
    const savedSeat = localStorage.getItem("seat");

    const bidBox = document.getElementById("bidding");
    for (let bid = 0; bid <= 13; bid++) {
      const button = document.createElement("button");
      button.textContent = bid;
      button.onclick = () => submitBid(bid);
      bidBox.appendChild(button);
    }

    function show(id, visible = true) {
document.getElementById(id).classList.toggle("hidden", !visible);

  if (id === "cardTable") {
    document.body.classList.toggle("game-active", visible);
  }
}
    function showRoomCode(roomCode) {
    document.getElementById("roomCodeDisplay");

  roomCodeDisplay.innerText =
    `ROOM CODE: ${roomCode}`;

  show("roomCodeDisplay", true);
  show("exitGame", true);
}
function requestTalkChoices() {
  socket.send(JSON.stringify({ type: "GET_TALK_CHOICES" }));
}

function sendTableTalk(message) {
  socket.send(JSON.stringify({
    type: "SEND_TABLE_TALK",
    payload: { message }
  }));
  show("talkChoices", false);
  show("newTalk", true);
}
    function sendCustomTalk() {
  const input =
    document.getElementById("customTalkInput");
  const message = input.value.trim();

  if (!message) return;

  sendTableTalk(message);
  input.value = "";
}
    function updateSeats(seats) {
      for (const seat of ["N", "E", "S", "W"]) {
        document.getElementById(`seat${seat}`).innerText =
  (document.body.classList.contains("game-active") ||
    seats[seat])
    ? "Occupied"
    : "Open";
      }
      const full = seats.N && seats.E && seats.S && seats.W;
      if (isHost) {
        show("matchSetup", true);
        show("startGame", Boolean(full));
      }
    }

    function updateBoards() {
      show("bidBoard", true);
      show("scoreBoard", true);
      const value = seat => bids[seat] === undefined ? "—" : bids[seat];
      const mine = myBid === null ? "—" : myBid;
      const myTricks = mySeat ? (tricks[mySeat] || 0) : 0;
      document.getElementById("bidBoard").innerHTML =
        `Bids — N: ${value("N")} | E: ${value("E")} | S: ${value("S")} | W: ${value("W")}<br>` +
        `Your bid: ${mine} | Your tricks: ${myTricks}`;
    }

    function updateScore(scores = { NS: 0, EW: 0 }, target = currentTarget) {
      currentTarget = target;
      show("scoreBoard", true);
      document.getElementById("scoreBoard").innerText = `NS: ${scores.NS} | EW: ${scores.EW} | Goal: ${target}`;
    }

    function renderHand(cards) {
      const suitSymbols = { S: "♠", H: "♥", D: "♦", C: "♣" };
      const suitOrder = { S: 0, H: 1, D: 2, C: 3 };
      const rankOrder = { A: 14, K: 13, Q: 12, J: 11, "10": 10, "9": 9, "8": 8, "7": 7, "6": 6, "5": 5, "4": 4, "3": 3, "2": 2 };
      const sorted = [...cards].sort((a, b) => suitOrder[a.suit] - suitOrder[b.suit] || rankOrder[b.rank] - rankOrder[a.rank]);
      document.getElementById("hand").innerHTML = sorted.map(card => {
        const color = card.suit === "H" || card.suit === "D" ? "#c62828" : "#111";
        return `<button style="color:${color}" onclick="playCard('${card.rank}','${card.suit}')">${card.rank}${suitSymbols[card.suit]}</button>`;
      }).join("");
    }

    socket.onopen = () => {
      statusEl.innerText = "Connected - Ready to Play!";
      socket.send(JSON.stringify({ type: "AUTH" }));
    };
    socket.onerror = () => statusEl.innerText = "Unable to connect to game server.";

    socket.onmessage = event => {
      const msg = JSON.parse(event.data);
      const p = msg.payload || {};
if (msg.type === "TABLE_TALK") {
  const tableTalk = document.getElementById("tableTalk");
  tableTalk.innerText = p.message;
  show("tableTalk", true);
}
     if (msg.type === "TABLE_TALK_CHOICES") {
  const talkChoices =
    document.getElementById("talkChoices");

  talkChoices.innerHTML = "";

  for (const message of p.choices || []) {
    const button = document.createElement("button");
    button.textContent = message;
    button.onclick = () => sendTableTalk(message);
    talkChoices.appendChild(button);
  }

  show("talkChoices", true);
  show("newTalk", true);
  show("customTalk", true);
}
      if (msg.type === "AUTH_OK") {
        myPlayerId = p.playerId;
        if (savedRoomCode && savedSeat) socket.send(JSON.stringify({ type: "REJOIN_ROOM", payload: { roomCode: savedRoomCode, seat: savedSeat } }));
      }

      if (msg.type === "ROOM_CREATED") {
        isHost = true;
        mySeat = p.seat;
        localStorage.setItem("roomCode", p.roomCode);
        localStorage.setItem("seat", p.seat);
        statusEl.innerText = `Game created! Room code: ${p.roomCode}`;
        updateSeats(p.seats);
        showRoomCode(p.roomCode);
      }

      if (msg.type === "PLAYER_JOINED") {
        if (p.playerId === myPlayerId) {
          mySeat = p.seat;
          localStorage.setItem("roomCode", p.roomCode);
          localStorage.setItem("seat", p.seat);
        }
        statusEl.innerText = `Joined room: ${p.roomCode}`;
        updateSeats(p.seats);
        showRoomCode(p.roomCode);
      }

      if (msg.type === "PLAYER_DISCONNECTED") updateSeats(p.seats);
    if (msg.type === "GAME_STATE") {
  mySeat = p.seat;
  isHost = Boolean(p.isHost);
      showRoomCode(p.roomCode);
  bids = p.bids || {};
  myBid = bids[mySeat] === undefined
    ? null
    : bids[mySeat];
  tricks = p.tricks || {
    N: 0,
    E: 0,
    S: 0,
    W: 0
  };
  currentTarget = p.targetScore || 500;

  localStorage.setItem("roomCode", p.roomCode);
  localStorage.setItem("seat", mySeat);

  updateSeats(p.seats);
  updateScore(p.scores, currentTarget);
  updateBoards();

  show("nilChoice", false);
  show("bidding", false);
  show("nextHand", false);
  show("newMatch", false);

  if (p.phase !== "LOBBY") {
    document.querySelector(".create").style.display = "none";
    document.body.classList.add("game-active");
document.querySelector(".join").style.display = "none";
    show("matchSetup", false);
    show("startGame", false);
    renderHand(p.cards || []);
    show("cardTable", true);
    requestTalkChoices();
  }

  if (p.phase === "LOBBY") {
    statusEl.innerText =
      `Rejoined room: ${p.roomCode}`;
  } else if (p.phase === "BIDDING") {
    if (p.bidTurn === mySeat && !p.nilChoice) {
      show("nilChoice", true);
    }

    if (
      p.bidTurn === mySeat &&
      p.nilChoice === "SEE_CARDS" &&
      myBid === null
    ) {
      show("bidding", true);
    }

    statusEl.innerText =
      p.bidTurn === mySeat
        ? "Your turn to bid"
        : `${p.bidTurn}'s turn to bid`;
  } else if (p.phase === "PLAYING") {
    statusEl.innerText =
      p.playTurn === mySeat
        ? "Your turn to play"
        : `${p.playTurn}'s turn`;
  } else if (p.phase === "HAND_OVER") {
    document.getElementById("hand").innerHTML = "";
    statusEl.innerText = "Hand over.";

    if (isHost) {
      const gameOver =
        p.scores.NS >= currentTarget ||
        p.scores.EW >= currentTarget;

      if (gameOver) {
        show("matchSetup", true);
        show("newMatch", true);
      } else {
        show("nextHand", true);
      }
    }
  }
}
       if (msg.type === "GAME_STARTED") {
document.body.classList.add("game-active");
      requestTalkChoices();
      show("cardTable", true);
      currentTarget = p.targetScore;
document.querySelector(".create").style.display = "none";
document.querySelector(".join").style.display = "none";
        show("matchSetup", false);
        show("startGame", false);
        updateScore({ NS: 0, EW: 0 }, currentTarget);
      }

      if (msg.type === "HAND_STARTED") {
        bids = {};
        myBid = null;
        tricks = { N: 0, E: 0, S: 0, W: 0 };
        trickPlays = [];
        document.getElementById("hand").innerHTML = "";
        show("nilChoice", false);
        show("bidding", false);
        show("nextHand", false);
        show("newMatch", false);
        updateScore(p.scores, p.targetScore);
        updateBoards();
        statusEl.innerText = `Hand ${p.handNumber}: East bids first`;
      }

      if (msg.type === "BID_TURN") {
        bids = p.bids || bids;
        updateBoards();
        show("nilChoice", false);
        show("bidding", false);
        statusEl.innerText = `${p.seat}'s turn to choose NIL or PLAY`;
      }

      if (msg.type === "NIL_PROMPT" && p.seat === mySeat) {
        show("nilChoice", true);
        statusEl.innerText = "Your turn: Choose NIL or PLAY";
      }

      if (msg.type === "NIL_LOCKED") {
        myBid = "NIL";
        show("nilChoice", false);
        show("bidding", false);
        updateBoards();
        statusEl.innerText = "NIL locked in for 100 points";
      }

      if (msg.type === "HAND_DEALT" && p.seat === mySeat) {
        renderHand(p.cards);
        show("nilChoice", false);
        show("bidding", Boolean(p.allowBid));
        if (p.allowBid) statusEl.innerText = "Choose your bid";
      }

      if (msg.type === "BID_SUBMITTED") {
        bids = p.bids || { ...bids, [p.seat]: p.bid };
        if (p.seat === mySeat) {
          myBid = p.bid;
          show("bidding", false);
          show("nilChoice", false);
        }
        updateBoards();
      }

      if (msg.type === "BIDDING_COMPLETE") {
        bids = p.bids;
        tricks = p.tricks;
        show("bidding", false);
        show("nilChoice", false);
        updateBoards();
        statusEl.innerText = "Bidding complete. East plays first.";
      }

      if (msg.type === "CARD_PLAYED") {
    document.body.classList.remove("table-rumble");
void document.body.offsetWidth;
document.body.classList.add("table-rumble");

setTimeout(() => {
document.body.classList.remove("table-rumble");
}, 350);
        tricks = p.tricks || tricks;
        trickPlays.push(`${p.seat} played ${p.card.rank}${p.card.suit}`);
        if (trickPlays.length > 4) {
  trickPlays = [
    trickPlays[trickPlays.length - 1]
  ];
}

if (trickPlays.length === 4) {
  setTimeout(() => {
    if (trickPlays.length === 4) {
      trickPlays = [];
      statusEl.innerText = `${p.nextTurn}'s turn`;
    }
  }, 1500);
}
        updateBoards();
        statusEl.innerText = `${trickPlays.join("\n")}\n${p.nextTurn}'s turn`;
      }

      if (msg.type === "HAND_OVER") {
        tricks = p.tricks;
        bids = p.bids;
        document.getElementById("hand").innerHTML = "";
        show("bidding", false);
        show("nilChoice", false);
        updateBoards();
        updateScore(p.totalScore, p.targetScore);
        statusEl.innerText = p.gameOver
          ? `MATCH OVER! ${p.winner} wins. Final score — NS: ${p.totalScore.NS}, EW: ${p.totalScore.EW}`
          : `Hand over — NS scored ${p.handScore.NS}, EW scored ${p.handScore.EW}.`;
        if (isHost) {
          if (p.gameOver) { show("matchSetup", true); show("newMatch", true); }
          else show("nextHand", true);
        }
      }

      if (msg.type === "ERROR") {
  if (p.message === "Room not found") {
localStorage.removeItem("roomCode");
    localStorage.removeItem("seat");
    mySeat = null;
    statusEl.innerText =
  "Choose CREATE GAME or JOIN GAME";
return;
  }

  statusEl.innerText =
    p.message || "Game error";
}
    };
function exitGame() {
  localStorage.removeItem("roomCode");
  localStorage.removeItem("seat");
  window.location.reload();
}
    function createGame() { socket.send(JSON.stringify({ type: "CREATE_ROOM" })); statusEl.innerText = "Creating game..."; }
    function joinGame() {
      const code = prompt("Enter your game room code:");
      if (!code) return;
      localStorage.removeItem("roomCode");
      localStorage.removeItem("seat");
      socket.send(JSON.stringify({ type: "JOIN_ROOM", payload: { roomCode: code.toUpperCase() } }));
      statusEl.innerText = "Joining game...";
    }
    function startGame() {
      currentTarget = Number(document.getElementById("targetScore").value);
      socket.send(JSON.stringify({ type: "START_GAME", payload: { targetScore: currentTarget } }));
    }
    function chooseNil() { socket.send(JSON.stringify({ type: "NIL_CHOICE", payload: { seat: mySeat, choice: "NIL" } })); }
    function seeCards() { socket.send(JSON.stringify({ type: "NIL_CHOICE", payload: { seat: mySeat, choice: "SEE_CARDS" } })); }
    function submitBid(bid) { socket.send(JSON.stringify({ type: "BID_SUBMITTED", payload: { seat: mySeat, bid } })); }
    function playCard(rank, suit) {
  playCard.selected = { rank, suit };
  show("throwCard", true);
  statusEl.innerText = `${rank}${suit} selected`;
}

function throwDownCard() {
  const card = playCard.selected;
  if (!card) return;

  socket.send(JSON.stringify({
    type: "CARD_PLAYED",
    payload: { seat: mySeat, card }
  }));

  playCard.selected = null;
  show("throwCard", false);
}
    function nextHand() { socket.send(JSON.stringify({ type: "NEXT_HAND" })); }
    function newMatch() {
      currentTarget = Number(document.getElementById("targetScore").value);
      socket.send(JSON.stringify({ type: "NEW_MATCH", payload: { targetScore: currentTarget } }));
    }
  </script>
</body>
</html>
