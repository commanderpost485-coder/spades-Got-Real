    function shuffleAvatars(list) {
  const mixed = [...list];

  for (let i = mixed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
  }

  return mixed;
}

function loadAvatarOptions() {
  const select = document.getElementById("avatarSelect");
  if (!select) return;

  select.innerHTML = "";

  const mixedAvatars = shuffleAvatars(AVATARS);

  mixedAvatars.forEach(avatar => {
    const option = document.createElement("option");
    option.value = avatar.file;
    option.textContent = avatar.label;
    select.appendChild(option);
  });

const customName = localStorage.getItem("customAvatarName");

    function showCustomAvatarForm() {
  const picker = document.createElement("input");
  picker.type = "file";
  picker.accept = "image/*";

  picker.onchange = () => {
    const file = picker.files && picker.files[0];
    if (!file) return;

    const name = prompt("What name do you want for your custom avatar?");
    if (!name) return;

    const cleanName = name.trim();
    if (!cleanName) return;

    const reader = new FileReader();

    reader.onload = () => {
      const preview = document.getElementById("avatarPreview");
      preview.src = reader.result;

      localStorage.setItem("customAvatarName", cleanName);
      localStorage.setItem("customAvatarImage", reader.result);

      const select = document.getElementById("avatarSelect");

      let customOption =
        document.getElementById("customAvatarOption");

      if (!customOption) {
        customOption = document.createElement("option");
        customOption.id = "customAvatarOption";
        select.appendChild(customOption);
      }

      customOption.value = "CUSTOM_AVATAR";
      customOption.textContent = cleanName;
      select.value = "CUSTOM_AVATAR";

      alert(`Custom avatar saved: ${cleanName}`);
    };

    reader.readAsDataURL(file);
  };

  picker.click();
}

    function updateSeats(seats) {
      for (const seat of ["N", "E", "S", "W"]) {
        document.getElementById(`seat${seat}`).innerText =
  (document.body.classList.contains("game-active") ||
    seats[seat])
    ? "Occupied"
    : "Open";
      }
      const full = seats.N && seats.E && seats.S && seats.W;
      if (isHost) {
        show("matchSetup", true);
        show("startGame", Boolean(full));
      }
    }

    function updateBoards() {
      show("bidBoard", true);
      show("scoreBoard", true);
      show("playedCards", true);
      const value = seat => bids[seat] === undefined ? "—" : bids[seat];
      const mine = myBid === null ? "—" : myBid;
      const myTricks = mySeat ? (tricks[mySeat] || 0) : 0;
      document.getElementById("bidBoard").innerHTML =
        `Bids — N: ${value("N")} | E: ${value("E")} | S: ${value("S")} | W: ${value("W")}<br>` +
        `Your bid: ${mine} | Your tricks: ${myTricks}`;
    }

    function updateScore(scores = { NS: 0, EW: 0 }, target = currentTarget) {
      currentTarget = target;
      show("scoreBoard", true);
      document.getElementById("scoreBoard").innerText = `NS: ${scores.NS} | EW: ${scores.EW} | Goal: ${target}`;
    }

    function renderHand(cards) {
      const suitSymbols = { S: "♠", H: "♥", D: "♦", C: "♣" };
      const suitOrder = { S: 0, H: 1, D: 2, C: 3 };
      const rankOrder = { A: 14, K: 13, Q: 12, J: 11, "10": 10, "9": 9, "8": 8, "7": 7, "6": 6, "5": 5, "4": 4, "3": 3, "2": 2 };
      const sorted = [...cards].sort((a, b) => suitOrder[a.suit] - suitOrder[b.suit] || rankOrder[b.rank] - rankOrder[a.rank]);
      document.getElementById("hand").innerHTML = sorted.map(card => {
        const color = card.suit === "H" || card.suit === "D" ? "#c62828" : "#111";
        return `<button style="color:${color}" onclick="playCard('${card.rank}','${card.suit}')">${card.rank}${suitSymbols[card.suit]}</button>`;
      }).join("");
    }

  socket.onopen = () => {
  statusEl.innerText = "Connected - Ready to Play!";
    
    socket.send(JSON.stringify({ type: "AUTH" 
  }));
};
    
    socket.onerror = () => statusEl.innerText = "Unable to connect to game server.";

function showAvailableVoices() {
  const voices = window.speechSynthesis
    .getVoices()
    .filter(voice =>
      voice.lang.toLowerCase().startsWith("en")
    );

  if (!voices.length) {
    alert("No English voices found.");
    return;
  }

  const list = voices.map((voice, i) =>
    i + ": " + voice.name + " - " + voice.lang
  ).join("\n");

  const choice = prompt(
    "Enter the number of the voice you want to hear:\n\n" + list
  );

  if (choice === null) return;

  const index = Number(choice);

  if (!Number.isInteger(index) || !voices[index]) {
    alert("That voice number is not available.");
    return;
  }

  const speech =
    new SpeechSynthesisUtterance(
      "This is my MuthaSpades table voice."
    );

  speech.voice = voices[index];

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

  } else if (style === "smoothMale") {

  } else if (style === "boldFemale") {
    speech.rate = 0.92;

  } else if (style === "streetMale") {

 window.speechSynthesis.cancel();

setTimeout(() => {

    socket.onmessage = event => {
      const msg = JSON.parse(event.data);
const p = msg.payload || {};
if (msg.type === "TABLE_TALK") {
  const tableTalk =
  document.getElementById("tableTalk");

  tableTalk.innerText = p.message;
  show("tableTalk", true);

  const speech =

  speech.pitch = 1.0;

  if (style === "olderMale") {
    speech.rate = 0.82;
    speech.pitch = 0.75;
  } else if (style === "olderFemale") {
    speech.rate = 0.88;
    speech.pitch = 1.1;
  } else if (style === "youngMale") {
    speech.rate = 1.05;
    speech.pitch = 0.9;
  } else if (style === "youngFemale") {
    speech.rate = 1.05;
    speech.pitch = 1.2;
  } else if (style === "streetMale") {
    speech.rate = 0.88;
    speech.pitch = 0.72;
  } else if (style === "streetFemale") {

}
     if (msg.type === "TABLE_TALK_CHOICES") {
  const talkChoices =
    document.getElementById("talkChoices");

  talkChoices.innerHTML = "";

  for (const message of p.choices || []) {
    const button = document.createElement("button");
    button.textContent = message;
    button.onclick = () => sendTableTalk(message);
    talkChoices.appendChild(button);
  }

  show("talkChoices", true);
  show("newTalk", true);
  show("customTalk", true);
}
      if (msg.type === "AUTH_OK") {
        myPlayerId = p.playerId;
        if (savedRoomCode && savedSeat) {
  socket.send(JSON.stringify({
    type: "REJOIN_ROOM",
    payload: {
      roomCode: savedRoomCode,
      seat: savedSeat,
      playerName: getPlayerName(),
      avatar: getSelectedAvatar()
    }
  }));
}
}
      
      if (msg.type === "ROOM_CREATED") {
        isHost = true;
        mySeat = p.seat;
        localStorage.setItem("roomCode", p.roomCode);
        localStorage.setItem("seat", p.seat);
        statusEl.innerText = `Game created! Room code: ${p.roomCode}`;
        updateSeats(p.seats);
        updateTableAvatars(p.avatars,    p.playerNames);
        showRoomCode(p.roomCode);
      }

      if (msg.type === "PLAYER_JOINED") {
        if (p.playerId === myPlayerId) {
          mySeat = p.seat;
          localStorage.setItem("roomCode", p.roomCode);
          localStorage.setItem("seat", p.seat);
        }
        statusEl.innerText = `Joined room: ${p.roomCode}`;
        updateSeats(p.seats);
        updateTableAvatars(p.avatars, p.playerNames);
        showRoomCode(p.roomCode);
      }
      if (msg.type === "PLAYER_DISCONNECTED") {
    updateSeats(p.seats); 
    updateTableAvatars(p.avatars, p.playerNames);
    }
    if (msg.type === "GAME_STATE") {
  mySeat = p.seat;
  isHost = Boolean(p.isHost);
      showRoomCode(p.roomCode);
      updateTableAvatars(p.avatars, p.playerNames);
bids = p.bids || {};
  myBid = bids[mySeat] === undefined
    ? null
    : bids[mySeat];
  tricks = p.tricks || {
    N: 0,
    E: 0,
    S: 0,
    W: 0
  };
  currentTarget = p.targetScore || 500;
      trickPlays = (p.currentTrick || []).map(play =>
  `${play.seat} played ${play.card.rank}${play.card.suit}`
);

  localStorage.setItem("roomCode", p.roomCode);
  localStorage.setItem("seat", mySeat);

  updateSeats(p.seats);
  updateScore(p.scores, currentTarget);
  currentPlayTurn = p.playTurn || null;
  updateBoards();

  show("nilChoice", false);
  show("bidding", false);
  show("nextHand", false);
  show("newMatch", false);

  if (p.phase !== "LOBBY") {
    document.querySelector(".create").style.display = "none";
    document.body.classList.add("game-active");
document.querySelector(".join").style.display = "none";
    show("matchSetup", false);
    show("startGame", false);
    renderHand(p.cards || []);
    show("cardTable", true);
    requestTalkChoices();
  }

  if (p.phase === "LOBBY") {
    statusEl.innerText =
      `Rejoined room: ${p.roomCode}`;
  } else if (p.phase === "BIDDING") {
    if (p.bidTurn === mySeat && !p.nilChoice) {
      show("nilChoice", true);
    }

    if (
      p.bidTurn === mySeat &&
      p.nilChoice === "SEE_CARDS" &&
      myBid === null
    ) {
      show("bidding", true);
    }

    statusEl.innerText =
      p.bidTurn === mySeat
        ? "Your turn to bid"
        : `${p.bidTurn}'s turn to bid`;
  } else if (p.phase === "PLAYING") {
    currentPlayTurn = p.playTurn;
updatePlayControls();
    const turnText = p.playTurn === mySeat
  ? "YOUR TURN TO PLAY"
  : `NEXT PLAYER: ${p.playTurn}`;

document.getElementById("playedCards").innerText =
  trickPlays.length ? `Cards played: ${trickPlays.join(" | ")}` : "Cards played: —";
statusEl.innerText = turnText;
  } else if (p.phase === "HAND_OVER") {
    document.getElementById("hand").innerHTML = "";
    statusEl.innerText = "Hand over.";

    if (isHost) {
      const gameOver =
        p.scores.NS >= currentTarget ||
        p.scores.EW >= currentTarget;

      if (gameOver) {
        show("matchSetup", true);
        show("newMatch", true);
      } else {
        show("nextHand", true);
      }
    }
  }
}
       if (msg.type === "GAME_STARTED") {
document.body.classList.add("game-active");
      requestTalkChoices();
      show("cardTable", true);
      currentTarget = p.targetScore;
document.querySelector(".create").style.display = "none";
document.querySelector(".join").style.display = "none";
        show("matchSetup", false);
        show("startGame", false);
        updateScore({ NS: 0, EW: 0 }, currentTarget);
      }

      if (msg.type === "HAND_STARTED") {
        bids = {};
        myBid = null;
        tricks = { N: 0, E: 0, S: 0, W: 0 };
        trickPlays = [];
        currentPlayTurn = null;
playCard.selected = null;
show("throwCard", false);
document.getElementById("hand").innerHTML = "";
        show("nilChoice", false);
        show("bidding", false);
        show("nextHand", false);
        show("newMatch", false);
        updateScore(p.scores, p.targetScore);
        updateBoards();
        statusEl.innerText = `Hand ${p.handNumber}: East bids first`;
      }

      if (msg.type === "BID_TURN") {
        currentPlayTurn = null;
        bids = p.bids || bids;
        updateBoards();
        show("nilChoice", false);
        show("bidding", false);
        statusEl.innerText = `${p.seat}'s turn to choose NIL or PLAY`;
      }

      if (msg.type === "NIL_PROMPT" && p.seat === mySeat) {
        show("nilChoice", true);
        statusEl.innerText = "Your turn: Choose NIL or PLAY";
      }

      if (msg.type === "NIL_LOCKED") {
        myBid = "NIL";
        show("nilChoice", false);
        show("bidding", false);
        updateBoards();
        statusEl.innerText = "NIL locked in for 100 points";
      }

      if (msg.type === "HAND_DEALT" && p.seat === mySeat) {
        renderHand(p.cards);
        show("nilChoice", false);
        show("bidding", Boolean(p.allowBid));
        if (p.allowBid) statusEl.innerText = "Choose your bid";
      }

      if (msg.type === "BID_SUBMITTED") {
        bids = p.bids || { ...bids, [p.seat]: p.bid };
        if (p.seat === mySeat) {
          myBid = p.bid;
          show("bidding", false);
          show("nilChoice", false);
        }
        updateBoards();
      }

      if (msg.type === "BIDDING_COMPLETE") {
        bids = p.bids;
        tricks = p.tricks;
        currentPlayTurn = p.playTurn;
        playCard.selected = null;
updatePlayControls();
        show("bidding", false);
        show("nilChoice", false);
        updateBoards();
        statusEl.innerText = "Bidding complete. East plays first.";
      }

      if (msg.type === "CARD_PLAYED") {
        currentPlayTurn = p.nextTurn;
playCard.selected = null;
updatePlayControls();
    if (p.playStyle === "throw") {
  document.body.classList.remove("table-rumble");
  void document.body.offsetWidth;
  document.body.classList.add("table-rumble");

  setTimeout(() => {
document.body.classList.remove("table-rumble");
  }, 350);
}
  
if (trickPlays.length >= 4) {
  trickPlays = [];
}
trickPlays.push(`${p.seat} played ${p.card.rank}${p.card.suit}`);
document.getElementById("playedCards").innerText =
  `Cards played: ${trickPlays.join(" | ")}`;
statusEl.innerText = `NEXT PLAYER: ${p.nextTurn}`;
      }

      if (msg.type === "HAND_OVER") {
        currentPlayTurn = null;
playCard.selected = null;
show("playCardButton", false);
show("throwCard", false);
tricks = p.tricks;
bids = p.bids;
        document.getElementById("hand").innerHTML = "";
        show("bidding", false);
        show("nilChoice", false);
        updateBoards();
        updateScore(p.totalScore, p.targetScore);
        statusEl.innerText = p.gameOver
          ? `MATCH OVER! ${p.winner} wins. Final score — NS: ${p.totalScore.NS}, EW: ${p.totalScore.EW}`
          : `Hand over — NS scored ${p.handScore.NS}, EW scored ${p.handScore.EW}.`;
        if (isHost) {
          if (p.gameOver) { show("matchSetup", true); show("newMatch", true); }
          else show("nextHand", true);
        }
      }

      if (msg.type === "ERROR") {
  if (p.message === "Room not found") {
localStorage.removeItem("roomCode");
    localStorage.removeItem("seat");
    mySeat = null;
    statusEl.innerText =
  "Choose CREATE GAME or JOIN GAME";
return;
  }

  statusEl.innerText =
    p.message || "Game error";
}

function exitGame(){
localStorage.removeItem("roomCode");
localStorage.removeItem("seat");
  window.location.reload();
}
    function createGame() {
  socket.send(JSON.stringify({
    type: "CREATE_ROOM",
    payload: {
      playerName: getPlayerName(),
      avatar: getSelectedAvatar()
    }
  }));
  statusEl.innerText = "Creating game...";
}
    function joinGame() {
  const code = prompt("Enter your game room code:");
  if (!code) return;

  localStorage.removeItem("roomCode");
  localStorage.removeItem("seat");

  socket.send(JSON.stringify({
    type: "JOIN_ROOM",
    payload: {
      roomCode: code.toUpperCase(),
      playerName: getPlayerName(),
      avatar: getSelectedAvatar()
    }
  }));

  statusEl.innerText = "Joining game...";
}
    function startGame() {
      currentTarget = Number(document.getElementById("targetScore").value);
      socket.send(JSON.stringify({ type: "START_GAME", payload: { targetScore: currentTarget } }));
    }
    function chooseNil() { socket.send(JSON.stringify({ type: "NIL_CHOICE", payload: { seat: mySeat, choice: "NIL" } })); }
    function seeCards() { socket.send(JSON.stringify({ type: "NIL_CHOICE", payload: { seat: mySeat, choice: "SEE_CARDS" } })); }
    function submitBid(bid) { socket.send(JSON.stringify({ type: "BID_SUBMITTED", payload: { seat: mySeat, bid } })); }
  function playCard(rank, suit) {
  if (currentPlayTurn !== mySeat) return;

  playCard.selected = { rank, suit };
  updatePlayControls();
  }

function sendSelectedCard(playStyle) {
  const card = playCard.selected;
  if (!card || currentPlayTurn !== mySeat) return;

  socket.send(JSON.stringify({
    type: "CARD_PLAYED",
    payload: {
      seat: mySeat,
      card,
      playStyle
    }
  }));

  playCard.selected = null;
  updatePlayControls();
}

function playSelectedCard() {
  sendSelectedCard("normal");
}

function throwDownCard() {
  sendSelectedCard("throw");
}
    function nextHand() { socket.send(JSON.stringify({ type: "NEXT_HAND" })); }
    function newMatch() {
      currentTarget = Number(document.getElementById("targetScore").value);
      socket.send(JSON.stringify({ type: "NEW_MATCH", payload: { targetScore: currentTarget } }));
    }
